name: Daily home discovery

# Runs once a day and asks the live app to find new matching homes (capped at 20
# suggestions). Also runnable on demand from the Actions tab. GitHub disables
# scheduled workflows after ~60 days of no repo activity — push occasionally to keep it alive.
on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled discovery
        run: |
          echo "Asking Nest to discover new homes…"
          curl -fsS -X POST "https://project-nest-2mzu.onrender.com/api/discover?scheduled=1" \
            --max-time 300 --retry 2 || echo "Trigger failed (Render may have been slow to wake) — will try again tomorrow."
